<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<script type="module">import '@fontsource-variable/vazirmatn';</script>
<style>
  html,body{margin:0}
  .og{width:1200px;height:630px;box-sizing:border-box;display:flex;align-items:center;gap:56px;padding:0 72px;
      background:radial-gradient(700px 420px at 20% 10%, rgba(47,127,131,.28), transparent 60%),#111a2c;color:#eef1f6;
      font-family:'Vazirmatn Variable',Tahoma,sans-serif}
  .txt{flex:1;display:flex;flex-direction:column;gap:20px}
  .brand{font-size:56px;font-weight:850;line-height:1.3}
  .brand i{display:inline-block;width:16px;height:16px;border-radius:50%;background:#f0c766;margin-inline-start:4px;vertical-align:top;margin-top:16px}
  h1{margin:0;font-size:52px;line-height:1.45;font-weight:850}
  p{margin:0;font-size:26px;color:#b4bfd2}
  img{width:380px;height:440px;object-fit:cover;border-radius:190px 190px 32px 32px}
</style>
</head>
<body>
<div class="og" id="og">
  <div class="txt">
    <div class="brand">دردونه<i></i></div>
    <h1>از اولین سؤال تا آخرین لالایی، کنارتان هستیم</h1>
    <p>سلامت خانواده با تأیید پزشک، قصه و لالایی شب. رایگان.</p>
  </div>
  <img src="/hero-poster.webp" alt="">
</div>
</body>
</html>
