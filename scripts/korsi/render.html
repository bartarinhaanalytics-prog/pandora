<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Korsi render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// ?shot=hero&w=1280&h=720 ; window.frame(t) رندر یک فریم در زمان t
import * as THREE from 'three';
import { buildKorsi, placeCamera } from './korsi-scene.js';

const q = new URLSearchParams(location.search);
const shot = q.get('shot') || 'hero';
const w = Number(q.get('w') || 1280);
const h = Number(q.get('h') || 720);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(w, h);
const { scene, camera, setTime } = buildKorsi(renderer);
camera.aspect = w / h;

window.frame = (t) => {
  setTime(t);
  placeCamera(camera, shot, t);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  return true;
};
window.frame(0);
document.body.dataset.ready = '1';
</script>
</body>
</html>
